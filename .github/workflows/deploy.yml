name: Deploy to Vercel

# Deploys via the Vercel CLI using a token rather than Vercel's Git integration.
# The Hobby plan only accepts deployments authored by the account owner, so pushes
# from other collaborators are rejected. Running the CLI with the owner's token
# means every push deploys, whoever made it.
#
# timeout-minutes is load-bearing: if Vercel's build queue stalls, `vercel deploy`
# blocks forever. Without a cap a single push burns the full 6-hour GitHub default
# and eats the monthly Actions allowance.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_YFhwDDc992p0iR5lL9mFEs3g
  VERCEL_PROJECT_ID: prj_vqdpSecYg7gfGnk3vmwXSk1WABwi
  VERCEL_CLI_VERSION: 59.1.3

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull project settings and environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
